aws:
  s3:
    mock: true

openai:
  # Never call the real OpenAI API from tests, even if OPENAI_API_KEY is set
  api-key: ""

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false