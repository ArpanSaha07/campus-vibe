aws:
  s3:
    mock: true

# Test-only, non-production values. These exist so tests never depend on the
# developer's environment: an exported OPENAI_API_KEY must not cause a test run
# to make live billed calls, and no real JWT secret belongs on the classpath.
campusvibe:
  ai:
    openai:
      api-key: ""
  auth:
    # Off by default under test. The suite deliberately makes many failed
    # sign-in attempts (wrong password, unknown email, tampered token), which
    # would trip the lockout and fail later tests for a reason that has nothing
    # to do with what they assert. AuthRateLimitIT switches it back on with its
    # own small limits.
    rate-limit:
      enabled: false

jwt:
  secret: "test-only-secret-0123456789-0123456789-0123456789"

spring:
  datasource:
    # PostgreSQL compatibility mode so entity DDL (TEXT columns) works on H2
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false