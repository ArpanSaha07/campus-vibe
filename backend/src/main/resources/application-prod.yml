# Production overrides. NON-SECRET VALUES ONLY.
#
# Secrets (JWT_SECRET, SPRING_DATASOURCE_PASSWORD, OPENAI_API_KEY) arrive as
# Elastic Beanstalk environment properties and are read by the placeholders in
# application.yml. Never add a secret to this file — it is committed.

server:
  error:
    # application.yml uses "always" for local debugging; exception messages
    # must not be returned to clients in production.
    include-message: never

spring:
  jpa:
    # Logging every statement in production is noise and can echo user data.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# No aws block. Production is simply the case where aws.s3.endpoint is left
# blank: S3Config then builds a client against AWS itself and resolves
# credentials through the default provider chain, which finds the EC2 instance
# role on Elastic Beanstalk. The aws.s3.mock: false that used to sit here went
# with the flag itself on 2026-09-12 (ADR-011).
#
# AWS_S3_BUCKET and AWS_REGION are environment properties and must be set on the
# environment; application.yml gives the bucket no default on purpose.

logging:
  level:
    root: INFO
    com.campusvibe: INFO
