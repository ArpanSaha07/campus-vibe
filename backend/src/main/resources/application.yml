server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: campusvibe
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/campusvibe}
    username: ${SPRING_DATASOURCE_USERNAME:arpan}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migrations
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  exposed-headers: Authorization

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    mock: ${AWS_S3_MOCK:true}
    buckets:
      clubs: ${AWS_S3_BUCKET_CLUBS:campusvibe-clubs}
      events: ${AWS_S3_BUCKET_EVENTS:campusvibe-events}

google:
  clientId: ${GOOGLE_CLIENT_ID:}

jwt:
  # Dev-only default; set JWT_SECRET in any real environment (min 32 bytes for HS256).
  secret: ${JWT_SECRET:campusvibe-dev-secret-0123456789-0123456789-0123456789}
  issuer: campusvibe
