server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: campusvibe
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/campusvibe}
    username: ${SPRING_DATASOURCE_USERNAME:arpan}
    # Required — no default. See docker/.env.example.
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migrations
    validate-on-migrate: true   # Fail fast if the schema is out of sync with the migrations. This value is true by default.
  servlet:
    multipart:
      # 5MB per image, per s3-media/reference.md §12 -- was 10MB until
      # 2026-09-11 (BUG-039). The request cap stays at 10MB so a multi-banner
      # POST /clubs/{id}/images still fits. DefaultExceptionHandler reads both
      # into the 413 it answers with.
      max-file-size: 5MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  exposed-headers: Authorization

aws:
  # ca-central-1, because that is where campusvibe-prod-media is. This said
  # us-east-1 until 2026-09-12, which nothing had noticed because no real
  # S3Client had ever been built -- the first one would have been built for the
  # wrong region AND pointed at a bucket that did not exist (BUG-051).
  region: ${AWS_REGION:ca-central-1}
  s3:
    # One bucket, every media kind, separated by key prefix (ADR-012).
    #
    # Deliberately no default. Two defaults naming buckets that did not exist
    # is exactly how BUG-051 stayed invisible: every environment looked
    # configured. An environment that does not name its bucket now fails to
    # start instead.
    bucket: ${AWS_S3_BUCKET}

    # Blank means AWS itself, with credentials from the default provider chain
    # (the EC2 instance role on Elastic Beanstalk). Anything else is an
    # S3-compatible store -- MinIO, locally and in CI -- which needs the
    # credentials below, because it has no instance role to borrow (ADR-011).
    #
    # There is no longer a mock flag: the client is always a real S3Client and
    # only its endpoint varies. The flag defaulted to true, so the real branch
    # had never executed anywhere.
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

google:
  clientId: ${GOOGLE_CLIENT_ID:}

campusvibe.mail:
  from: ${MAIL_FROM:no-reply@campusvibe.local}
  # Links in emails point at the FRONTEND, not the API — a reset link has to
  # open a page a human can type into. Cannot be derived from the request: the
  # request arrives from the frontend server, not the browser.
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  reset-token-ttl: ${MAIL_RESET_TOKEN_TTL:1h}
  verify-token-ttl: ${MAIL_VERIFY_TOKEN_TTL:24h}

# NOTE: spring.mail.host is deliberately NOT declared here.
#
# Declaring it with an empty default (${MAIL_HOST:}) *sets* the property to an
# empty string, which is not the same as leaving it unset: MailConfig's
# @ConditionalOnProperty then matches and picks SmtpMailSender pointed at host
# "", and Boot's mail health indicator tries to connect to it and reports the
# whole application DOWN — /actuator/health answers 503 and the Docker
# healthcheck never passes.
#
# To enable real delivery, set these as environment variables instead:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
# Unset, the application uses LoggingMailSender and writes messages — links
# included — to this log.
spring.mail.properties:
  mail.smtp.auth: true
  mail.smtp.starttls.enable: true

management.health.mail.enabled: false  # mail is optional; its outage is not ours

campusvibe.auth:
  # OFF by default. Turning it on refuses sign-in to a LOCAL account whose
  # address has never been confirmed — a real barrier against throwaway
  # addresses, at the cost of locking out anyone whose mail never arrives.
  # A product decision, so it is a switch rather than a default.
  require-verified-email: ${AUTH_REQUIRE_VERIFIED_EMAIL:false}
  # OFF for now. Turning it on refuses accepting or declining a club admin
  # invitation until the account has confirmed its address. That check is what
  # stops someone who registered an invitee's address first from claiming the
  # invitation, but confirmation mail is not reliably delivered yet, so real
  # invitees were stuck. Turn it back on once it is. Ownership handovers are
  # not affected by this switch and always require a confirmed address.
  require-verified-email-for-invitations: ${AUTH_REQUIRE_VERIFIED_EMAIL_FOR_INVITATIONS:false}

# The first platform administrator. Every admin path is behind hasRole('ADMIN'),
# including approving the club-admin requests that give a club its first owner,
# so a system with no admin cannot acquire one through the product at all.
#
# OFF by default. Turning it on grants ROLE_ADMIN to the named account at
# startup, creating the account first only if it does not exist and a password
# is supplied. It never revokes: see AdminBootstrapRunner.
campusvibe.bootstrap.admin:
  enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
  email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  # Only used when the address has no account yet. Leave blank to promote an
  # existing account, which is the normal case and the only one that works for
  # a Google account -- it has no password to set.
  password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

campusvibe.auth.rate-limit:
  # Bounds online password guessing, signup spam and enumeration through
  # /email-status. In-memory and per instance — see AuthRateLimiter for what
  # that costs and when it stops being enough.
  enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
  ip-requests-per-window: ${AUTH_RATE_LIMIT_IP_REQUESTS:20}
  window: ${AUTH_RATE_LIMIT_WINDOW:1m}
  max-failed-logins: ${AUTH_RATE_LIMIT_MAX_FAILED_LOGINS:5}
  lockout-duration: ${AUTH_RATE_LIMIT_LOCKOUT:15m}
  # Only true behind a proxy that sets X-Forwarded-For (an ALB). On a directly
  # exposed app it lets a caller forge an IP per request and bypass the limit.
  trust-forwarded-header: ${AUTH_RATE_LIMIT_TRUST_XFF:false}

# AI providers. Every value is externalised so the same artifact runs unchanged
# in local dev (docker/.env) and production (Elastic Beanstalk environment
# properties) — only the source of the values differs.
campusvibe:
  ai:
    provider: openai
    openai:
      # OPTIONAL. Blank runs search in keyword-only mode with no OpenAI calls.
      api-key: ${OPENAI_API_KEY:}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
      read-timeout: ${OPENAI_READ_TIMEOUT:10s}
      max-retries: ${OPENAI_MAX_RETRIES:2}
      # The planner (spec 2026-09-16-planner-backend). Unlike search, the planner
      # does not degrade without a key: it answers 503.
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1200}
      # One whole streamed reply, first byte to last.
      chat-timeout: ${OPENAI_CHAT_TIMEOUT:60s}

search:
  semantic-weight: 0.7
  keyword-weight: 0.3
  # Gates meaning-only matches; a keyword hit always qualifies. 0.25 needs a
  # cosine of about 0.357 at the 0.7 weight. Measured 2026-09-14 against
  # text-embedding-3-small: real matches scored 0.38 and up, noise 0.33 and
  # below (spec 2026-09-14-search-relevance-and-results).
  min-score: 0.25
  # Caches embeddings of search *queries* only, never results (BUG-005).
  # Document embeddings live in pgvector; these were recomputed per request,
  # including for the identical repeats a search box produces constantly.
  query-embedding-cache:
    max-entries: ${SEARCH_EMBEDDING_CACHE_ENTRIES:1000}
    ttl: ${SEARCH_EMBEDDING_CACHE_TTL:1h}

campusvibe.search.rate-limit:
  # Bounds OpenAI spend on the deliberately-public search endpoints (BUG-005).
  # Separate budget from the auth limiter: different reason, different numbers,
  # and neither may consume the other's allowance.
  enabled: ${SEARCH_RATE_LIMIT_ENABLED:true}
  ip-requests-per-window: ${SEARCH_RATE_LIMIT_IP_REQUESTS:30}
  window: ${SEARCH_RATE_LIMIT_WINDOW:1m}

jwt:
  # Required — no default. A committed fallback would let any environment that
  # forgets to set this sign forgeable tokens with a publicly known key.
  # Minimum 32 bytes for HS256; generate with: openssl rand -hex 32
  secret: ${JWT_SECRET}
  issuer: campusvibe
