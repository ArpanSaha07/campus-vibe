name: Docker

# Reusable. Called only by ci.yml. The most expensive job in the pipeline,
# which is affordable now that CI runs once per PR rather than on every push.
#
# It boots the full compose stack (Postgres + backend + frontend) and asserts
# it actually serves traffic. This is the only place that exercises the
# Dockerfiles, the compose wiring, and container-to-container networking.

on:
  workflow_call:

permissions:
  contents: read

env:
  # Pins the names `docker compose build` gives the images, so the Trivy step
  # below has something deterministic to scan.
  COMPOSE_PROJECT_NAME: campusvibe

jobs:
  compose-up:
    name: Build images and run the stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/.env is gitignored, so at this point it does not exist. Compose
      # marks POSTGRES_PASSWORD and JWT_SECRET with `:?`, so it must refuse to
      # produce a config at all. This asserts the fail-fast guard still works —
      # a regression here would let an environment start with no JWT secret.
      # Must stay ahead of the step that writes .env.
      - name: Verify compose refuses to start without required secrets
        working-directory: ./docker
        run: |
          set -uo pipefail
          if [ -f .env ]; then
            echo "::error::docker/.env is committed. It must stay gitignored."
            exit 1
          fi

          if err=$(docker compose config 2>&1); then
            echo "::error::compose produced a config with no secrets set; the ':?' guards are gone."
            exit 1
          fi

          echo "$err"
          if ! echo "$err" | grep -qiE 'POSTGRES_PASSWORD|JWT_SECRET'; then
            echo "::error::compose failed, but not because of the required secrets."
            exit 1
          fi
          echo "Fail-fast guard confirmed."

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # backend/Dockerfile COPYs backend/target/campusvibe-*.jar rather than
      # building inside the image, so the jar must exist before `compose build`.
      #
      # This is a second Maven build: the backend job already produced a jar,
      # but consuming its artifact would mean `needs: backend`, which serialises
      # the two jobs and breaks outright on a frontend-only PR — the docker job
      # would still need a jar while the backend job was skipped. The trade is
      # deliberate: extra runner minutes to keep the jobs parallel. Build-once
      # and promote is the real fix, and it belongs with CD, where a registry
      # exists.
      - name: Build backend jar
        working-directory: ./backend
        run: ./mvnw -B -DskipTests -DskipITs package

      - name: Create docker/.env
        working-directory: ./docker
        run: |
          set -euo pipefail
          cat > .env <<EOF
          POSTGRES_DB=campusvibe
          POSTGRES_USER=campusvibe_ci
          POSTGRES_PASSWORD=ci-only-password
          JWT_SECRET=$(openssl rand -hex 32)
          OPENAI_API_KEY=
          GOOGLE_CLIENT_ID=
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=
          NEXT_PUBLIC_API_URL=http://localhost:8080
          AWS_REGION=us-east-1
          AWS_S3_MOCK=true
          AWS_S3_BUCKET_CLUBS=campusvibe-clubs
          AWS_S3_BUCKET_EVENTS=campusvibe-events
          EOF
          echo "Wrote docker/.env (JWT_SECRET generated, OpenAI key left blank)."

      - name: Build images
        working-directory: ./docker
        run: docker compose build

      - name: Start the stack
        working-directory: ./docker
        run: docker compose up -d

      # `--wait` is not used: it would mask which service failed. Waiting
      # per-service makes the failing one obvious in the log.
      - name: Wait for Postgres to report healthy
        working-directory: ./docker
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' campusvibe-db 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "Postgres healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Postgres never became healthy."
          docker compose ps
          exit 1

      # Same status-capture reasoning as _database.yml: 000 is a connection
      # refusal, anything else is served-but-not-UP. Without it, a container
      # that crash-loops and one that is up but has no actuator produce an
      # identical message. The container-running check below separates those
      # two cases before the timeout is even reached.
      - name: Wait for the backend
        working-directory: ./docker
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health 2>/dev/null || echo 000)
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Backend UP — Flyway ran and the schema validated inside the container."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' campusvibe-backend 2>/dev/null)" != "true" ]; then
              echo "::error::Backend container is no longer running."
              docker compose logs backend --tail 200
              exit 1
            fi
            sleep 5
          done
          echo "::error::Backend never became healthy (last HTTP status: $code)."
          echo "Container health: $(docker inspect -f '{{.State.Health.Status}}' campusvibe-backend 2>/dev/null || echo unknown)"
          if [ "$code" = "000" ]; then
            # The compose healthcheck probes localhost INSIDE the container, so
            # a healthy container that this loop cannot reach isolates the fault
            # to port publishing rather than to the application.
            echo "Nothing accepted a connection on the published port."
            echo "If container health above is 'healthy', the app is fine and the"
            echo "8080:8080 port mapping is what broke."
          else
            echo "The container is serving HTTP but /actuator/health did not report UP."
            echo "A 404 or 500 here means the endpoint is absent — check that"
            echo "spring-boot-starter-actuator is still a backend dependency."
          fi
          exit 1

      - name: Wait for the frontend
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3000 2>/dev/null; then
              echo "Frontend responding."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Frontend never responded on :3000."
          exit 1

      - name: Smoke test the API
        run: |
          set -euo pipefail

          echo "--- GET /ping ---"
          curl -fsS http://localhost:8080/ping && echo

          # Public endpoint backed by real data, so this proves the backend
          # reached Postgres over the compose network rather than merely
          # starting. Asserts non-empty rather than a fixed count, because the
          # seed source is planned to move from V6 into a dev seeder.
          echo "--- GET /api/v1/clubs ---"
          body=$(curl -fsS http://localhost:8080/api/v1/clubs)
          count=$(echo "$body" | jq 'length')
          echo "clubs returned: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::/api/v1/clubs returned an empty list; the backend is not reading seeded data."
            exit 1
          fi

          echo "--- GET /api/v1/clubs/search?q=coding ---"
          curl -fsS "http://localhost:8080/api/v1/clubs/search?q=coding" | jq 'length'

          # Unauthenticated access to a protected route must be rejected.
          echo "--- GET /api/v1/clubs/my-club (expect 401/403) ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/clubs/my-club)
          echo "status: $code"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::Protected endpoint returned $code for an unauthenticated request."
            exit 1
          fi

      # The compose stack pins `target: dev`, so the `runner` stage — the image
      # that would actually ship — is never built anywhere. Build and boot it
      # here, on port 3001 so it does not collide with the dev container still
      # running on 3000.
      - name: Build and boot the production frontend image
        run: |
          set -euo pipefail
          docker build \
            --target runner \
            -f frontend/Dockerfile \
            -t campusvibe-frontend:prod \
            .

          docker run -d --name campusvibe-frontend-prod -p 3001:3000 campusvibe-frontend:prod

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3001 2>/dev/null; then
              echo "Production frontend image serves / on :3001."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' campusvibe-frontend-prod)" != "true" ]; then
              echo "::error::Production frontend container exited."
              docker logs campusvibe-frontend-prod --tail 100
              exit 1
            fi
            sleep 3
          done
          echo "::error::Production frontend never responded on :3001."
          docker logs campusvibe-frontend-prod --tail 100
          exit 1

      # Pinned to a release tarball rather than piping contrib/install.sh from
      # the upstream `main` branch into a shell. That script is unversioned by
      # definition — whatever was merged upstream minutes ago would run here —
      # and a vulnerability scanner that is itself installed from a moving
      # target is an odd thing to trust. Bump TRIVY_VERSION by hand; Dependabot
      # does not watch raw downloads.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      # Two passes on purpose.
      #
      # The first is a report: every fixable HIGH and CRITICAL, printed, never
      # failing. Base images (node:24-alpine, eclipse-temurin:25-jdk-alpine)
      # routinely carry a handful of HIGHs that no change in this repo can
      # resolve, and a gate that red-lights every PR for those trains people to
      # ignore CI — the same reasoning that keeps frontend lint non-blocking.
      #
      # The second is the actual gate, narrowed to fixable CRITICALs. That set
      # is small and actionable. Tighten to HIGH once the baseline is known to
      # be clean — as of BUG-016 the production frontend image reports zero
      # fixable HIGHs, so that tightening is now within reach for this image.
      #
      # The advice printed on failure used to say `bump the base image`, which
      # sent the first real failure looking in the wrong place: two of the three
      # CRITICALs were npm packages this repo controls, and the third was npm's
      # own bundled copy inside node:24-alpine, which no published tag fixed.
      # Report the finding class instead and let the reader route it.
      - name: Scan images for known vulnerabilities
        run: |
          set -euo pipefail
          backend_image=$(docker inspect -f '{{.Config.Image}}' campusvibe-backend)
          echo "Backend image:  $backend_image"
          echo "Frontend image: campusvibe-frontend:prod"

          for img in "$backend_image" campusvibe-frontend:prod; do
            echo "::group::Trivy report (HIGH+CRITICAL, fixable) — $img"
            trivy image --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 0 "$img"
            echo "::endgroup::"
          done

          failed=0
          classes=""
          for img in "$backend_image" campusvibe-frontend:prod; do
            echo "--- Gate: fixable CRITICAL — $img ---"
            if ! trivy image --scanners vuln --ignore-unfixed \
              --severity CRITICAL --exit-code 1 --quiet "$img"; then
              failed=1
              # Which ecosystem a finding came from decides who fixes it, so
              # collect the classes rather than guessing in the error message.
              classes="$classes $(trivy image --scanners vuln --ignore-unfixed \
                --severity CRITICAL --format json --quiet "$img" \
                | jq -r '[.Results[]? | select(.Vulnerabilities != null) | .Class]
                         | unique | join(",")')"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::A fixable CRITICAL vulnerability is present (finding classes:$classes)."
            echo "Route it by class. Do not assume the base image is at fault:"
            echo "  lang-pkgs — a dependency (node-pkg, jar). Check the Target"
            echo "              column for the path. Under /app it is ours, so"
            echo "              bump it in frontend/package-lock.json with"
            echo "              npm update <pkg>, or npm install <pkg>@<version>"
            echo "              when the fix sits outside the declared range."
            echo "              Under /usr/local/lib/node_modules it is tooling"
            echo "              vendored into the base image; if the runtime"
            echo "              stage does not use it, delete it there."
            echo "  os-pkgs   — the base image proper. Bump the tag, and if no"
            echo "              published tag carries the fix yet, say so in"
            echo "              bugs.md rather than leaving CI red."
            exit 1
          fi
          echo "No fixable CRITICAL vulnerabilities."

      - name: Dump container logs
        if: failure()
        working-directory: ./docker
        run: |
          docker compose ps
          echo "=================== db ==================="
          docker compose logs db --tail 100
          echo "================= backend ================"
          docker compose logs backend --tail 200
          echo "================ frontend ================"
          docker compose logs frontend --tail 100

      - name: Remove the production frontend container
        if: always()
        run: docker rm -f campusvibe-frontend-prod 2>/dev/null || true

      - name: Tear down
        if: always()
        working-directory: ./docker
        run: docker compose down -v --remove-orphans
