name: CodeQL Triage

# Reads the alerts a CodeQL analysis produced and writes a triage back to
# GitHub, so findings do not sit unread on the Security tab until someone
# thinks to look.
#
# WHY THIS IS A SEPARATE WORKFLOW, not a step inside codeql.yml: that workflow
# uploads SARIF and finishes. The alerts only exist *after* the code-scanning
# service has ingested it, so anything reading them has to run afterwards.
# `workflow_run` is the only trigger that fires at that point.
#
# TRIAGE ONLY. This never edits, commits or pushes code. Every CodeQL finding
# splits three ways — a real defect, code that is correct as written, and a
# false positive needing dismissal — and only the first is safe to automate.
# Auto-committing security fixes to a branch nobody is watching is a worse
# failure than a finding sitting unread for a day.
#
# THE ONE THING THAT WILL LOOK BROKEN: `workflow_run` only fires for workflow
# files that exist on the **default branch**. Until this file is merged to
# `main` it will never trigger on its own, with nothing in the Actions tab to
# explain the silence. Use `workflow_dispatch` below to exercise it before then.
#
# Shares CLAUDE_CODE_OAUTH_TOKEN with claude-code-review.yml. If that secret is
# unset or expired this job fails loudly rather than skipping — a security
# triage that silently stops running is worse than one that is obviously broken.

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  # Manual runs, and the only way to exercise this before it reaches `main`.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the pull request to triage'
        required: true
        type: string

concurrency:
  # One triage per PR at a time: a newer analysis of the same PR cancels the
  # older triage, which would only be overwritten anyway. A run with no PR
  # (the main baseline analysis, skipped below) keys on its own run id, so it
  # can never cancel a PR's triage.
  group: codeql-triage-${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # Reading the alerts. Note this is `read`: nothing here may resolve or dismiss
  # an alert. Dismissal is a judgement about intent and stays a human action on
  # the Security tab.
  security-events: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  triage:
    name: Triage CodeQL alerts
    # A cancelled analysis uploaded nothing, so there is nothing to read. A
    # failed one may still have uploaded results for the language that worked —
    # codeql.yml runs the two languages with fail-fast off precisely so that one
    # extractor breaking does not cost the other's findings.
    #
    # Restricted to the pull_request analysis. codeql.yml also analyses main to
    # keep the code-scanning baseline fresh, but every alert in that run was
    # already triaged on the PR that introduced it — triaging again after the
    # merge spends an agent run on a report with no PR to post to and nobody to
    # read it.
    #
    # The PR number comes from the workflow_run payload. It is empty for a PR
    # from a fork, which this repository does not take; such a run is skipped
    # rather than guessing a PR from the branch name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.pull_requests[0].number)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr }}

    steps:
      - name: Checkout the analysed merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull_request analysis runs on the PR's MERGE commit, not its head,
          # and the alert line numbers point into that merge. Checking out the
          # head (or the branch) shows Claude different code from the code
          # CodeQL looked at whenever main has moved since the branch forked.
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          fetch-depth: 1

      - name: Triage
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(gh api:*),Bash(gh pr:*),Bash(echo:*),Read,Grep,Glob"
          prompt: |
            Triage the CodeQL alerts on pull request #$PR_NUMBER of
            ${{ github.repository }}. The working directory is that PR's merge
            commit, the code CodeQL analysed.

            ## Step 1 — get the PR's alerts

            A pull_request analysis files its alerts under the PR's merge ref,
            NOT under the branch name. `refs/heads/<branch>` holds whatever the
            branch had when it was last scanned on its own, which may be months
            old; never query it.

            ```
            gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?ref=refs/pull/$PR_NUMBER/merge&tool_name=CodeQL&state=open&per_page=100"
            ```

            ## Step 2 — split them into new and pre-existing

            Get the baseline, the alerts open on main:

            ```
            gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?ref=refs/heads/main&tool_name=CodeQL&state=open&per_page=100" --jq '.[].number'
            ```

            An alert open on the PR ref whose `number` is NOT in that list is
            **new**: this PR introduced it. One whose number is in the list is
            **pre-existing**. Match on the alert number, never on file or line:
            the same alert keeps its number across refs while its line moves.
            If the main query fails or returns nothing, say there is no
            baseline and treat every alert as new.

            Then find any earlier triage comment of this workflow on the PR
            (`gh pr view $PR_NUMBER --comments`; it starts with `## CodeQL triage`).

            - **No new alerts and no earlier comment:** write one line to
              $GITHUB_STEP_SUMMARY and STOP. Do not post. A bot that comments
              "nothing found" on every PR trains people to ignore it.
            - **No new alerts but an earlier comment exists:** edit it to say
              this PR no longer introduces any CodeQL alert, so a stale verdict
              does not stay on the PR. Then STOP.
            - Otherwise continue.

            ## Step 3 — classify each NEW alert into exactly one of three

            Read the flagged code before judging it. Never classify from the
            rule name alone: whether a finding is real depends on what reaches
            the sink, which is in the source, not the alert.

            - **Real defect** — the code is wrong and should change. Say what
              breaks and under what input.
            - **Correct as written** — the code does this deliberately. Name the
              reason it is deliberate, from a comment or the surrounding design.
            - **Not reachable** — the pattern is genuinely there but the input
              cannot arrive. State the constraint that prevents it AND where
              that constraint lives; a guarantee held in another file is worth
              flagging as fragile even when it currently holds.

            Be honest about uncertainty. "I could not tell whether X is
            reachable" is useful; a confident wrong call is not.

            ## Step 4 — report

            Post ONE comment on the PR, starting with the heading
            `## CodeQL triage — PR #$PR_NUMBER`. If the earlier triage comment
            from Step 2 exists, replace it with
            `gh pr comment $PR_NUMBER --edit-last --body ...` instead of
            adding another; otherwise use
            `gh pr comment $PR_NUMBER --body ...`.

            Lead with the count of NEW alerts and the single most serious one.
            Group the new alerts by classification, most serious first. For
            each: alert number, rule id, file:line, one sentence on the
            verdict, and the concrete next action.

            Close with the pre-existing alerts as a short list of one line
            each (number, rule id, file:line) and no new verdict: they were
            triaged on the PR that introduced them, and the reader needs to
            see what THIS PR adds.

            End with a short note that fixes are applied by a human running
            Claude Code locally on the branch, and that dismissals happen on the
            Security tab. Do NOT tell the reader to reply @claude — that path is
            not currently wired up on this repository.

            ## Rules

            - Never edit, commit or push code. You have no write tools; do not
              try to work around that.
            - Never dismiss or resolve an alert. That is a human decision.
            - Report accurately. If you could not read something, say which
              alert you skipped rather than guessing at it.
