name: Backend

# Reusable. Called only by ci.yml — never triggered directly, so it carries no
# `paths:` filter of its own. Change detection lives in the orchestrator.

on:
  workflow_call:

# The `full-tier` input is gone as of 2026-08-16. It existed to skip the *IT
# suites on a feature-branch push; ci.yml no longer triggers on push at all, so
# every caller was passing true and the -DskipITs branch was unreachable. A
# dormant second code path in a test pipeline is a liability — it rots, and the
# day someone re-enables it they get a tier nobody has run in months.

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # A cold Maven cache plus the failsafe suites lands around 6 minutes.
    # 20 is generous enough not to flake and short enough to notice a hang —
    # the GitHub default is six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Must match backend/pom.xml <java.version> and backend/Dockerfile.
      # JDK 17 cannot compile this project at all. (BUG-002)
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # mvnw is mode 100755 in the index, so no chmod step is needed.
      #
      # Tests are deliberately never skipped: skipping them is what let a
      # non-compiling merge and a failing search test reach the branch unnoticed.
      # This runs surefire (unit) and failsafe (*IT) together — the *IT classes
      # need a Spring context (H2) or a Testcontainers pgvector container.
      - name: Build and test
        run: ./mvnw -B verify

      # Uploaded even on failure — otherwise the only way to see which
      # assertion broke is to reproduce the whole run locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jar
          path: backend/target/campusvibe-*.jar
          if-no-files-found: error
          retention-days: 7
