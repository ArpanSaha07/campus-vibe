name: Backend

# Reusable. Called only by ci.yml — never triggered directly, so it carries no
# `paths:` filter of its own. Change detection lives in the orchestrator.

on:
  workflow_call:
    inputs:
      run-integration-tests:
        description: >-
          false skips the failsafe *IT suites (-DskipITs), which need a Spring
          context or a Testcontainers pgvector container. Unit tests always run,
          and the jar is packaged either way, so downstream jobs are unaffected.
        type: boolean
        required: false
        default: true

# History, because this input came back after being deleted. It existed as
# `full-tier` until 2026-08-16, was removed when ci.yml stopped triggering on
# push (every caller then passed true, so the branch was unreachable), and
# returned the same day with branch-checks.yml, which needs the cheap variant.
#
# Two things changed in the second version. It defaults to **true**, so a caller
# that forgets it gets more testing rather than less. And it is named for a
# behaviour rather than a policy — `full-tier` described which CI tier you were
# in, so it read as meaningless the moment the tiers were rearranged.

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # A cold Maven cache plus the failsafe suites lands around 6 minutes.
    # 20 is generous enough not to flake and short enough to notice a hang —
    # the GitHub default is six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match backend/pom.xml <java.version> and backend/Dockerfile.
      # JDK 17 cannot compile this project at all. (BUG-002)
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # mvnw is mode 100755 in the index, so no chmod step is needed.
      #
      # Tests are never skipped wholesale: skipping them is what let a
      # non-compiling merge and a failing search test reach the branch unnoticed.
      # Only the *IT classes can be dropped, and only on a branch push — the PR
      # runs them before anything can merge.
      #
      # Written as an `if` in bash rather than a GitHub expression on purpose:
      # an empty string is falsy in GitHub expressions, so the tempting
      # `inputs.run-integration-tests && '' || '-DskipITs'` evaluates wrong in
      # the true branch and silently skips the suites it meant to run.
      - name: Build and test
        run: |
          if [ "${{ inputs.run-integration-tests }}" = "true" ]; then
            echo "Running unit and integration tests."
            ./mvnw -B verify
          else
            echo "Running unit tests only. The *IT suites run on the pull request."
            ./mvnw -B verify -DskipITs
          fi

      # Uploaded even on failure — otherwise the only way to see which
      # assertion broke is to reproduce the whole run locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jar
          path: backend/target/campusvibe-*.jar
          if-no-files-found: error
          retention-days: 7
