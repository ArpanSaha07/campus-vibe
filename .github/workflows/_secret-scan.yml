name: Secret scan

# Reusable. Called by ci.yml (pull requests) and branch-checks.yml (pushes).
#
# Extracted into its own file on 2026-08-16 when branch pushes got their own
# workflow. Copying it would have put the pinned gitleaks version in two places,
# and the copy nobody edits is the one that rots — a stale scanner in a job whose
# entire purpose is catching the one mistake a follow-up commit cannot undo.
#
# Runs regardless of which paths changed. A credential can be committed to any
# file, so scoping this by component would be scoping the wrong thing.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned deliberately. This previously resolved `latest` from the GitHub
      # API at run time, on the reasoning that a stale tag could never break the
      # pipeline. That trades integrity for availability, and integrity wins in
      # a step that pipes a downloaded tarball into `sudo tar` inside a job
      # holding repository credentials: whatever upstream published five minutes
      # ago would execute as root, unreviewed. Dependabot does not watch this,
      # so bump it by hand when there is a reason to.
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Full history: the scan below walks commits, not the working tree, and
      # the default depth of 1 would leave it nothing to walk. 87 commits at the
      # time of writing — the fetch costs a couple of seconds.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary, not gitleaks/gitleaks-action@v2 — that action requires a
      # paid GITLEAKS_LICENSE for organisation-owned repositories and fails
      # closed without one.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `git` scans commit history, not the working tree. Two reasons:
      #
      #   1. A secret that was committed and later deleted is still compromised.
      #      Only a history scan sees it. Scanning the tree would report the
      #      repo as clean while the credential sits one `git log -p` away.
      #   2. `dir` has no gitignore awareness, so it also reads build output —
      #      locally it scanned 99 MB of frontend/.next and returned 7 findings,
      #      every one of them a Next.js manifest key. History has none of that.
      #
      # Verified locally at gitleaks 8.30.1: 68 commits, 1.56 MB, 428 ms.
      #
      # --redact keeps any match out of the log, which is world-readable on a
      # public repo. A genuine false positive belongs in .gitleaksignore at the
      # repo root — with a comment justifying it — never in a loosened flag.
      - name: Scan commit history
        run: gitleaks git . --redact --verbose --no-banner
