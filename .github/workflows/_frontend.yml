name: Frontend

# Reusable. Called only by ci.yml. Runs identically in both tiers — the whole
# job is under two minutes, so there is nothing worth deferring to the PR.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match the `node:` tag in frontend/Dockerfile. CI testing on one
      # major while the shipped image runs another is how a build passes here
      # and fails in the container.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per re-run.

      # BLOCKING as of 2026-08-05. The 5 pre-existing errors are fixed, so a new
      # one is now genuinely new and stops the merge. 15 warnings remain and do
      # not fail the build — `eslint` exits non-zero on errors only.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Type check
        if: '!cancelled()'
        run: npm run type-check

      # The suite under frontend/app/__tests__ (React Testing Library + Jest).
      # --ci makes snapshot mismatches fail rather than silently rewrite.
      - name: Unit tests
        if: '!cancelled()'
        run: npm test -- --ci

      # NEXT_PUBLIC_* values are inlined at build time. They are set here only
      # so the build is deterministic in CI; the real Docker build passes them
      # as build args. (BUG-004)
      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ''
