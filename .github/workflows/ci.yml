name: CI

# The single entry point. Everything else under .github/workflows/_*.yml is a
# reusable workflow called from here and never triggered on its own.
#
# WHY ONE WORKFLOW INSTEAD OF FOUR
#
# The previous layout put `paths:` filters at the workflow level. That makes
# required status checks impossible: a PR touching only frontend/ never STARTS
# backend-ci, so a branch-protection rule requiring it waits forever on
# "Expected — Waiting for status". Filtering at the JOB level instead, behind a
# single always-run gate job, still produces exactly one check that always
# reports.
#
# That filtering is now coarse on purpose: everything runs, or — on a change
# with no code in it — nothing does. See the `changes` job for why per-component
# globs were the wrong shape for this repository.
#
# BRANCH PROTECTION: the `Protect main` ruleset requires exactly one check, "CI",
# which is the `ci-success` job below. Never require the component jobs — that
# reintroduces the deadlock this design exists to avoid.
#
# WHY THERE IS NO `push:` TRIGGER — AND WHY ADDING ONE WOULD BE A BUG
#
# There used to be, and it made every commit on a branch with an open PR run
# twice — measured at 12 of the last 20 commits, one of them three times.
# Dependabot suffered worst, since it pushes a branch AND opens a PR.
#
# It must not come back here, for a reason beyond cost. A required status check
# is matched by NAME. This workflow emits `CI`, the single context the ruleset
# requires. A second run producing `CI` on the same commit makes it ambiguous
# which one satisfies the gate — and if that were a push run, the gate could go
# green on a commit whose integration suites, Flyway migration and Docker stack
# never ran.
#
# Branch pushes are handled by branch-checks.yml instead: its own workflow, its
# own check name, and a job that skips everything when the branch already has an
# open PR so no commit is ever tested twice.
#
# Nothing runs after a merge to main. The ruleset sets
# `strict_required_status_checks_policy: true`, so a PR branch must be up to
# date with main before merging — what the PR tested IS the merge result. If
# that strict setting is ever turned off, this reasoning dies with it.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  # Keyed on the PR, so a rapid series of pushes leaves one run rather than a
  # queue of superseded ones. Merge-queue runs are never cancelled: each one is
  # gating a specific merge, and cancelling it fails that merge.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Did this change touch anything that could possibly affect a build?
  #
  # This asks the question the SAFE way round. It used to filter per component —
  # `backend/**` runs the backend job, `frontend/**` runs the frontend job — and
  # that requires a hand-written dependency graph to be complete. A glob that is
  # merely *incomplete* does not fail; it silently skips a job and reports green,
  # which is the one failure mode a CI system must not have.
  #
  # Inverted, the burden changes from "prove this component is affected" to
  # "prove nothing is affected", and the only list to maintain is of paths that
  # provably cannot influence a build. A file that is not on that list runs
  # everything — so the cost of forgetting to update this is wasted minutes,
  # never a missed failure.
  #
  # Affordable because the repository is public (Actions minutes are free) and CI
  # runs once per PR rather than on every push. Before that it would have been
  # roughly twelve minutes per commit and nobody would have read the results.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect whether any code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `merge_group` and `workflow_dispatch` give paths-filter no base commit to
      # diff against. Fail OPEN: run everything. A wasted full run is the cheap
      # mistake; silently skipping every job is the expensive one.
      #
      # `pull_request` needs no such handling — paths-filter diffs against the
      # base branch, which always exists.
      - name: Decide whether change detection can be trusted
        id: force
        run: |
          set -euo pipefail
          force=false
          case "${EVENT_NAME}" in
            workflow_dispatch|merge_group)
              force=true
              echo "Running everything: event is ${EVENT_NAME}, which has no base to diff against."
              ;;
          esac
          echo "all=$force" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}

      # Everything, minus the paths that cannot influence a build. Adding to the
      # exclusion list is a claim that a file is inert — verify it before
      # believing it. Markdown qualifies today only because nothing imports it;
      # adopting MDX in the frontend would make `**/*.md` build input and this
      # exclusion wrong.
      - name: Filter paths
        id: filter
        if: steps.force.outputs.all != 'true'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.vscode/**'
              - '!LICENSE'
              - '!.gitattributes'

      - name: Combine
        id: decide
        run: |
          set -euo pipefail
          # `!= false` rather than `== true`, deliberately. If the filter step is
          # skipped, or a future version of the action changes its output, the
          # value is empty and this still runs everything. The only way to skip
          # is for the filter to say so explicitly.
          if [ "$ALL" = "true" ] || [ "$CODE" != "false" ]; then
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            echo "Running every job."
          else
            echo "code=false" | tee -a "$GITHUB_OUTPUT"
            echo "Documentation-only change: no build, test or image job will run."
          fi
        env:
          ALL: ${{ steps.force.outputs.all }}
          CODE: ${{ steps.filter.outputs.code }}

  # ---------------------------------------------------------------------------
  # Runs whatever changed, including on a docs-only PR: a leaked credential is
  # the one failure a follow-up commit cannot undo, and it can be in any file.
  # Shared with branch-checks.yml so the pinned scanner version has one home.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/_secret-scan.yml

  # ---------------------------------------------------------------------------
  # Components. All four run together or not at all — the only thing that skips
  # them is a change with no code in it. They run in parallel, so the wall-clock
  # cost is the slowest one (docker, ~3 min) rather than their sum.
  #
  # `ci-success` below treats a skip as a pass, which is what lets a docs-only
  # PR satisfy the required check without running a build.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_frontend.yml

  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_database.yml

  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_docker.yml

  # ---------------------------------------------------------------------------
  # THE required status check — the `CI` context named in the `Protect main`
  # ruleset. Require this one, and only this one.
  #
  # `always()` is what makes it report even when every component skipped, and
  # the failure test below counts only real failures and cancellations —
  # `skipped` passes. That combination is precisely what lets job-level path
  # filtering coexist with branch protection.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI
    if: always()
    needs: [changes, secret-scan, backend, frontend, database, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report component results
        run: |
          echo "changes:     ${{ needs.changes.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "backend:     ${{ needs.backend.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "database:    ${{ needs.database.result }}"
          echo "docker:      ${{ needs.docker.result }}"

      - name: Fail if any component failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Pass
        run: echo "All required checks passed or were not applicable."
