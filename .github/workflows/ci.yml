name: CI

# The single entry point. Everything else under .github/workflows/_*.yml is a
# reusable workflow called from here and never triggered on its own.
#
# WHY ONE WORKFLOW INSTEAD OF FOUR
#
# The previous layout put `paths:` filters at the workflow level. That makes
# required status checks impossible: a PR touching only frontend/ never STARTS
# backend-ci, so a branch-protection rule requiring it waits forever on
# "Expected — Waiting for status". Filtering at the JOB level instead, behind a
# single always-run gate job, keeps the work component-scoped while still
# producing exactly one check that always reports.
#
# BRANCH PROTECTION: the `Protect main` ruleset requires exactly one check, "CI",
# which is the `ci-success` job below. Never require the component jobs — that
# reintroduces the deadlock this design exists to avoid.
#
# WHY THERE IS NO `push:` TRIGGER
#
# There used to be, and it made every commit on a branch with an open PR run
# twice — measured at 12 of the last 20 commits, one of them three times.
# Dependabot suffered worst, since it pushes a branch AND opens a PR.
#
# Dropping `push` also removes the need to re-test after a merge. The ruleset
# sets `strict_required_status_checks_policy: true`, so a PR branch must be up
# to date with main before it can merge — which means what the PR tested IS the
# merge result. A main run would re-prove it seconds later. If that strict
# setting is ever turned off, this reasoning dies with it and `push:
# branches: [main]` has to come back.
#
# The cost is that a push to a feature branch or to develop now runs nothing.
# `scripts/verify.mjs`, via `.githooks/pre-push`, runs the same lint,
# type-check, test and build for BOTH components before the push leaves the
# machine — `git push --no-verify` is the hole, and the PR closes it.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  # Keyed on the PR, so a rapid series of pushes leaves one run rather than a
  # queue of superseded ones. Merge-queue runs are never cancelled: each one is
  # gating a specific merge, and cancelling it fails that merge.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Which components does this change actually touch?
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      db: ${{ steps.decide.outputs.db }}
      docker: ${{ steps.decide.outputs.docker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `merge_group` and `workflow_dispatch` give paths-filter no base commit to
      # diff against. Fail OPEN: run everything. A wasted full run is the cheap
      # mistake; silently skipping every component is the expensive one.
      #
      # `pull_request` needs no such handling — paths-filter diffs against the
      # base branch, which always exists.
      - name: Decide whether change detection can be trusted
        id: force
        run: |
          set -euo pipefail
          force=false
          case "${EVENT_NAME}" in
            workflow_dispatch|merge_group)
              force=true
              echo "Running every component: event is ${EVENT_NAME}, which has no base to diff against."
              ;;
          esac
          echo "all=$force" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Filter paths
        id: filter
        if: steps.force.outputs.all != 'true'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/_backend.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/_frontend.yml'
            db:
              - 'backend/src/main/resources/db/migrations/**'
              - 'backend/src/main/java/**'
              - 'backend/pom.xml'
              - '.github/workflows/_database.yml'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - '.dockerignore'
              - '.github/workflows/_docker.yml'
            # A change to the pipeline itself is the one case where the pipeline
            # cannot be trusted to scope itself, so it runs everything.
            workflows:
              - '.github/workflows/**'

      - name: Combine
        id: decide
        run: |
          set -euo pipefail
          all='${{ steps.force.outputs.all }}'
          wf='${{ steps.filter.outputs.workflows }}'

          decide() {
            if [ "$all" = "true" ] || [ "$wf" = "true" ] || [ "$1" = "true" ]; then
              echo true
            else
              echo false
            fi
          }

          {
            echo "backend=$(decide '${{ steps.filter.outputs.backend }}')"
            echo "frontend=$(decide '${{ steps.filter.outputs.frontend }}')"
            echo "db=$(decide '${{ steps.filter.outputs.db }}')"
            echo "docker=$(decide '${{ steps.filter.outputs.docker }}')"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Runs on every component. A leaked credential is the one failure that cannot
  # be undone by a follow-up commit.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned deliberately. This previously resolved `latest` from the GitHub
      # API at run time, on the reasoning that a stale tag could never break the
      # pipeline. That trades integrity for availability, and integrity wins in
      # a step that pipes a downloaded tarball into `sudo tar` inside a job
      # holding repository credentials: whatever upstream published five minutes
      # ago would execute as root, unreviewed. Dependabot does not watch this,
      # so bump it by hand when there is a reason to.
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Full history: the scan below walks commits, not the working tree, and
      # the default depth of 1 would leave it nothing to walk. 87 commits at the
      # time of writing — the fetch costs a couple of seconds.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary, not gitleaks/gitleaks-action@v2 — that action requires a
      # paid GITLEAKS_LICENSE for organisation-owned repositories and fails
      # closed without one.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `git` scans commit history, not the working tree. Two reasons:
      #
      #   1. A secret that was committed and later deleted is still compromised.
      #      Only a history scan sees it. Scanning the tree would report the
      #      repo as clean while the credential sits one `git log -p` away.
      #   2. `dir` has no gitignore awareness, so it also reads build output —
      #      locally it scanned 99 MB of frontend/.next and returned 7 findings,
      #      every one of them a Next.js manifest key. History has none of that.
      #
      # Verified locally at gitleaks 8.30.1: 68 commits, 1.56 MB, 428 ms.
      #
      # --redact keeps any match out of the log, which is world-readable on a
      # public repo. A genuine false positive belongs in .gitleaksignore at the
      # repo root — with a comment justifying it — never in a loosened flag.
      - name: Scan commit history
        run: gitleaks git . --redact --verbose --no-banner

  # ---------------------------------------------------------------------------
  # Components. Each is skipped when its paths are untouched; `ci-success`
  # below treats a skip as a pass.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_frontend.yml

  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/_database.yml

  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/_docker.yml

  # ---------------------------------------------------------------------------
  # THE required status check — the `CI` context named in the `Protect main`
  # ruleset. Require this one, and only this one.
  #
  # `always()` is what makes it report even when every component skipped, and
  # the failure test below counts only real failures and cancellations —
  # `skipped` passes. That combination is precisely what lets job-level path
  # filtering coexist with branch protection.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI
    if: always()
    needs: [changes, secret-scan, backend, frontend, database, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report component results
        run: |
          echo "changes:     ${{ needs.changes.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "backend:     ${{ needs.backend.result }}"
          echo "frontend:    ${{ needs.frontend.result }}"
          echo "database:    ${{ needs.database.result }}"
          echo "docker:      ${{ needs.docker.result }}"

      - name: Fail if any component failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Pass
        run: echo "All required checks passed or were not applicable."
