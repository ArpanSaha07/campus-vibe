# Trivy exceptions. Every entry needs an ADR, and is scoped three ways so it
# cannot silence anything else: by id, by package version (purls), and by an
# expiry date after which Trivy stops honouring it and the gate fails again.
# Read by .github/workflows/_docker.yml through --ignorefile.

vulnerabilities:
  # ADR-022, accepted by Arpan 2026-11-07. spring-webmvc 6.2.19 is the last
  # free 6.2.x and Spring Boot 3.5.16 the last 3.5, so no version override
  # exists; the public fix is Spring Framework 7 (Spring Boot 4), which removes
  # both entries. Do not move the date: extend only by a new decision.
  - id: CVE-2026-47884
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-12-31
    statement: >-
      Needs XsltView rendering a view without an explicit view name. The
      backend is a JSON API with no XsltView, no ViewResolver and no template
      engine. ADR-022.
  - id: CVE-2026-47890
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-12-31
    statement: >-
      Needs Server-Sent Events carrying view fragments. The planner's
      SseEmitter sends JSON data only (SseReplySink.java:94). ADR-022.
