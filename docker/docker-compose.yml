# Values come from docker/.env, which Compose loads automatically because it
# sits beside this file. Copy .env.example to .env to get started.
#
#   ${VAR:?msg}  required — Compose refuses to start if unset
#   ${VAR:-}     optional — empty is a supported mode
services:
  db:
    # postgres:15 + pgvector extension, needed for hybrid semantic search (V8 migration)
    image: pgvector/pgvector:pg15
    container_name: campusvibe-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusvibe}
      POSTGRES_USER: ${POSTGRES_USER:-arpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "5332:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -d is required: without it pg_isready defaults the dbname to the
      # username, and the failed connect logs "FATAL: database ... does not
      # exist" every interval even though the check itself passes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arpan} -d ${POSTGRES_DB:-campusvibe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    develop:
      watch:
        # Postgres runs a stock image with nothing to compile, so the only
        # watchable input is the init scripts in db/. Two caveats: the schema
        # here is owned by Flyway (migrations ship inside the backend jar), so
        # db/ is empty and this rule rarely fires; and Postgres only executes
        # init scripts when the data directory is empty, so a change also needs
        # `docker compose down -v` to take effect. No restart action, because
        # bouncing the database would drop the backend's connection pool.
        - action: sync
          path: ../db
          target: /docker-entrypoint-initdb.d

  # The object store. Not a stand-in that behaves like S3 -- a store that
  # speaks S3, which a real S3Client talks to with nothing changed but its
  # endpoint (ADR-011). It replaced FakeS3, a filesystem stub, on 2026-09-12;
  # the commented adobe/s3mock block that used to sit here went with it, because
  # two half-adopted stand-ins was the problem rather than the choice between
  # them.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: campusvibe-minio
    environment:
      # Local, non-secret, and not AWS credentials -- MinIO's own root user.
      # Overridable from docker/.env like the database password; the defaults
      # are deliberately obvious so nothing here ever resembles a real key.
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:-campusvibe-local}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:-campusvibe-local-secret}
    command: server /data --console-address ":9001"
    ports:
      # 9000 is the S3 API, 9001 the browser console -- handy for seeing that an
      # upload actually landed, and under what key.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Answers without credentials once the API is accepting requests. The
      # image ships curl; busybox wget is not present.
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket and exits. MinIO starts empty, and the backend does not
  # create its own bucket -- in production it has no permission to, the instance
  # role grants object verbs on one bucket and nothing else. Idempotent, so a
  # restart is a no-op rather than an error.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: campusvibe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${AWS_S3_ACCESS_KEY:-campusvibe-local}
      ${AWS_S3_SECRET_KEY:-campusvibe-local-secret} &&
      mc mb --ignore-existing local/${AWS_S3_BUCKET:-campusvibe-media} &&
      echo 'Bucket ${AWS_S3_BUCKET:-campusvibe-media} is ready.'
      "

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: campusvibe-backend
    environment:
      # Activates application-dev.yml, which is what makes @Profile("dev") beans
      # run at all — DevDataSeeder above all. Production sets this to `prod`,
      # where the seeder is not registered and cannot execute.
      # Local development runs the `dev` profile. Overridable, but the default
      # is dev rather than none because a @Profile("dev") bean with no active
      # dev profile does not fail -- it compiles, deploys and silently never
      # runs, which is a much worse way to find out.
      #
      # The `test` and `it` profiles are set by @ActiveProfiles in the suites
      # and replace this rather than adding to it, so tests never see dev.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-campusvibe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-arpan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}

      # Required: the app refuses to start without a >=32-byte secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env (openssl rand -hex 32)}

      # Optional: blank runs search in keyword-only mode with no OpenAI calls.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-2s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-10s}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_CHAT_TIMEOUT: ${OPENAI_CHAT_TIMEOUT:-60s}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Mail. Unset SPRING_MAIL_HOST means the backend logs messages instead of
      # sending them, which is the normal local setup — reset and confirmation
      # links appear in `docker compose logs backend`.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@campusvibe.local}
      # Links point at the frontend, so this is a browser-reachable address.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

      # Grants ROLE_ADMIN to one existing account at startup. Off by default:
      # with it enabled and an email set, sign up through the app first, then
      # restart to be promoted. Never revokes — see AdminBootstrapRunner.
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-Administrator}

      # Loads the demo clubs when the clubs table is empty. Set false for a
      # deliberately empty local database.
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}

      AUTH_REQUIRE_VERIFIED_EMAIL: ${AUTH_REQUIRE_VERIFIED_EMAIL:-false}
      AUTH_REQUIRE_VERIFIED_EMAIL_FOR_INVITATIONS: ${AUTH_REQUIRE_VERIFIED_EMAIL_FOR_INVITATIONS:-false}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_IP_REQUESTS: ${AUTH_RATE_LIMIT_IP_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      AUTH_RATE_LIMIT_MAX_FAILED_LOGINS: ${AUTH_RATE_LIMIT_MAX_FAILED_LOGINS:-5}
      AUTH_RATE_LIMIT_LOCKOUT: ${AUTH_RATE_LIMIT_LOCKOUT:-15m}
      AUTH_RATE_LIMIT_TRUST_XFF: ${AUTH_RATE_LIMIT_TRUST_XFF:-false}
      AUTH_RATE_LIMIT_TRUSTED_PROXY_HOPS: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_HOPS:-2}

      # One bucket for every media kind, separated by key prefix (ADR-012).
      # Production sets this to campusvibe-prod-media; application.yml gives it
      # no default, so an environment that forgets it fails to start rather than
      # failing NoSuchBucket on the first upload -- which is what BUG-051 was.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-campusvibe-media}
      AWS_REGION: ${AWS_REGION:-ca-central-1}

      # Setting an endpoint is what points the real S3Client at MinIO instead of
      # AWS. Production leaves it unset and the SDK's default provider chain
      # resolves the EC2 instance role. There is no mock flag any more: the
      # client is always real, and only where it points changes (ADR-011).
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-campusvibe-local}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-campusvibe-local-secret}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      # Waits for the bucket, not just the store: the backend does not create
      # it, so starting before minio-init has run would mean NoSuchBucket on
      # the first upload of a cold stack.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # busybox wget, already in eclipse-temurin:25-jdk-alpine, so no extra
      # package. Its exit code is enough: actuator answers 200 only when the
      # aggregate status is UP and 503 when it is DOWN, and wget fails on any
      # non-2xx — so there is nothing to grep for. Needs
      # spring-boot-starter-actuator on the classpath (BUG-015).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Flyway plus Hibernate validation puts first boot around 15-20s locally
      # and slower on a cold CI runner. Failures inside this window do not count
      # against retries, so a normal start is never reported as unhealthy.
      start_period: 45s
    # No source bind-mount: the image runs a packaged jar at /app/app.jar, and
    # mounting ../backend over /app hides it.
    develop:
      watch:
        # The image compiles nothing — it just packages a jar built on the host
        # — so the jar is the real input, not backend/src. Run
        # `mvn -f backend/pom.xml package` and this copies the result in and
        # restarts the JVM. Flyway migrations are bundled in the jar, so they
        # ride along. sync+restart rather than rebuild: the image compiles
        # nothing, so a rebuild would re-send the build context and re-run
        # `docker build` only to COPY the same jar this rule already syncs in.
        # (The repo-root .dockerignore keeps that context small either way.)
        - action: sync+restart
          path: ../backend/target/campusvibe-0.0.1-SNAPSHOT.jar
          target: /app/app.jar

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Runs `next dev` instead of the packaged production build. Without a
      # compiler watching the synced files, nothing below has any visible
      # effect. Drop this line to serve the production build again.
      target: dev
    container_name: campusvibe-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}

      # Where server-rendered pages reach the backend. NEXT_PUBLIC_API_URL is a
      # browser address: inside this container `localhost:8080` is the container
      # itself, so a Server Component fetching it would connect to nothing. The
      # compose network resolves `backend` to the backend service instead.
      #
      # Not NEXT_PUBLIC_ deliberately — a service name means nothing to a
      # browser, so this must stay out of the client bundle. app/lib/api.tsx
      # only reads it when `window` is undefined.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080}
    ports:
      - "3000:3000"
    depends_on:
      # Waits for the backend to answer /actuator/health, not merely to have
      # started, so an SSR page never renders against a backend that is still
      # running migrations. Costs roughly 20s on `compose up`.
      #
      # The trade-off is real: if the backend cannot start, the frontend does
      # not start either, so frontend-only work is blocked. Escape hatch is
      # `docker compose up db frontend`, which ignores the condition because
      # the backend was never requested.
      backend:
        condition: service_healthy
    develop:
      watch:
        # Source edits land in the running dev server and Next recompiles the
        # changed route in place. No restart, so the backend and db containers
        # are never touched. Target is /app because WORKDIR is /app and the
        # router lives at /app/app — syncing ../frontend/app onto /app would
        # put page.tsx one directory too high.
        - action: sync
          path: ../frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
            - next.config.ts
            - Dockerfile

        # next.config.ts is read once at boot, so syncing it alone does nothing.
        - action: sync+restart
          path: ../frontend/next.config.ts
          target: /app/next.config.ts

        # Dependency changes need `npm install`, which only the image build runs.
        # Paths are relative to this compose file, so ../frontend/ is required —
        # a bare `package.json` resolves to docker/package.json and never fires.
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json
    # No source bind-mount: watch syncs the source in instead, which avoids the
    # slow filesystem crossing that a Windows bind-mount into the VM incurs.

volumes:
  db_data:
  # Uploaded media survives `docker compose down`, the way the database does.
  # `down -v` drops both together, which is the reset a developer wants.
  minio_data:
