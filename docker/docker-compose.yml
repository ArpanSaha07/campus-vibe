# Values come from docker/.env, which Compose loads automatically because it
# sits beside this file. Copy .env.example to .env to get started.
#
#   ${VAR:?msg}  required — Compose refuses to start if unset
#   ${VAR:-}     optional — empty is a supported mode
services:
  db:
    # postgres:15 + pgvector extension, needed for hybrid semantic search (V8 migration)
    image: pgvector/pgvector:pg15
    container_name: campusvibe-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusvibe}
      POSTGRES_USER: ${POSTGRES_USER:-arpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "5332:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -d is required: without it pg_isready defaults the dbname to the
      # username, and the failed connect logs "FATAL: database ... does not
      # exist" every interval even though the check itself passes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arpan} -d ${POSTGRES_DB:-campusvibe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    develop:
      watch:
        # Postgres runs a stock image with nothing to compile, so the only
        # watchable input is the init scripts in db/. Two caveats: the schema
        # here is owned by Flyway (migrations ship inside the backend jar), so
        # db/ is empty and this rule rarely fires; and Postgres only executes
        # init scripts when the data directory is empty, so a change also needs
        # `docker compose down -v` to take effect. No restart action, because
        # bouncing the database would drop the backend's connection pool.
        - action: sync
          path: ../db
          target: /docker-entrypoint-initdb.d

  # s3:
  #   image: adobe/s3mock:3.1.0
  #   container_name: campusvibe-s3
  #   ports:
  #     - "9090:9090"
  #   environment:
  #     - initialBuckets=campusvibe-clubs,campusvibe-events,campusvibe-user

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: campusvibe-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-campusvibe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-arpan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}

      # Required: the app refuses to start without a >=32-byte secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env (openssl rand -hex 32)}

      # Optional: blank runs search in keyword-only mode with no OpenAI calls.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-2s}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-10s}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # No AWS credentials here: the SDK's default provider chain resolves an
      # IAM role in production and your local profile in development.
      AWS_S3_MOCK: ${AWS_S3_MOCK:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET_CLUBS: ${AWS_S3_BUCKET_CLUBS:-campusvibe-clubs}
      AWS_S3_BUCKET_EVENTS: ${AWS_S3_BUCKET_EVENTS:-campusvibe-events}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget, already in eclipse-temurin:25-jdk-alpine, so no extra
      # package. Its exit code is enough: actuator answers 200 only when the
      # aggregate status is UP and 503 when it is DOWN, and wget fails on any
      # non-2xx — so there is nothing to grep for. Needs
      # spring-boot-starter-actuator on the classpath (BUG-015).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Flyway plus Hibernate validation puts first boot around 15-20s locally
      # and slower on a cold CI runner. Failures inside this window do not count
      # against retries, so a normal start is never reported as unhealthy.
      start_period: 45s
    # No source bind-mount: the image runs a packaged jar at /app/app.jar, and
    # mounting ../backend over /app hides it.
    develop:
      watch:
        # The image compiles nothing — it just packages a jar built on the host
        # — so the jar is the real input, not backend/src. Run
        # `mvn -f backend/pom.xml package` and this copies the result in and
        # restarts the JVM. Flyway migrations are bundled in the jar, so they
        # ride along. sync+restart rather than rebuild: the image compiles
        # nothing, so a rebuild would re-send the build context and re-run
        # `docker build` only to COPY the same jar this rule already syncs in.
        # (The repo-root .dockerignore keeps that context small either way.)
        - action: sync+restart
          path: ../backend/target/campusvibe-0.0.1-SNAPSHOT.jar
          target: /app/app.jar

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # Runs `next dev` instead of the packaged production build. Without a
      # compiler watching the synced files, nothing below has any visible
      # effect. Drop this line to serve the production build again.
      target: dev
    container_name: campusvibe-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      # Waits for the backend to answer /actuator/health, not merely to have
      # started, so an SSR page never renders against a backend that is still
      # running migrations. Costs roughly 20s on `compose up`.
      #
      # The trade-off is real: if the backend cannot start, the frontend does
      # not start either, so frontend-only work is blocked. Escape hatch is
      # `docker compose up db frontend`, which ignores the condition because
      # the backend was never requested.
      backend:
        condition: service_healthy
    develop:
      watch:
        # Source edits land in the running dev server and Next recompiles the
        # changed route in place. No restart, so the backend and db containers
        # are never touched. Target is /app because WORKDIR is /app and the
        # router lives at /app/app — syncing ../frontend/app onto /app would
        # put page.tsx one directory too high.
        - action: sync
          path: ../frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
            - next.config.ts
            - Dockerfile

        # next.config.ts is read once at boot, so syncing it alone does nothing.
        - action: sync+restart
          path: ../frontend/next.config.ts
          target: /app/next.config.ts

        # Dependency changes need `npm install`, which only the image build runs.
        # Paths are relative to this compose file, so ../frontend/ is required —
        # a bare `package.json` resolves to docker/package.json and never fires.
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/package-lock.json
    # No source bind-mount: watch syncs the source in instead, which avoids the
    # slow filesystem crossing that a Windows bind-mount into the VM incurs.

volumes:
  db_data:
