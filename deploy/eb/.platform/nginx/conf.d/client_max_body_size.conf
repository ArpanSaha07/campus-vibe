# Elastic Beanstalk's nginx refuses request bodies over 1 MB by default, which
# is under the backend's 5 MB per-file upload cap. Without this, every image
# upload over 1 MB in production is nginx's own HTML 413, and no local or CI
# test can see it because neither runs nginx.
#
# 10M matches spring.servlet.multipart.max-request-size in application.yml, so
# Spring stays the one refusing an oversize upload, with its readable 413.
# Change the two together.
#
# Amazon Linux 2023 platforms include every .platform/nginx/conf.d/*.conf in the
# http block. scripts/package-eb.mjs stages .platform/ into the bundle root.
client_max_body_size 10M;
